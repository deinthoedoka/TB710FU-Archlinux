# TB710FU / WCN7850 (ath12k). Both options are load-time only:
#  tb_poll_off=1   - the process-context poller races NAPI on the same SRNG and oopses
#                    during downloads (MSI does fire on this board), so keep NAPI only.
#  tb_hw_dedup=1   - without hardware dedup mac80211 drops the AP's retransmitted MPDUs
#                    as duplicates -> TCP loss, cwnd collapse (0.1-0.5 MB/s instead of 3+).
# Do NOT set tb_sw_reorder (worse) and never change tb_poll_ms at runtime (hangs the board).
options ath12k tb_poll_off=1 tb_rx_ampdu=1 board_name="bus=pci,vendor=17cb,device=1107,subsystem-vendor=17cb,subsystem-device=3378,qmi-chip-id=2,qmi-board-id=255"
options cfg80211 ieee80211_regdom=CN
options ath12k_wifi7 tb_hw_dedup=1
# on demand: wifi-on (tb-wifi.service) - the driver has hung this board in the past
blacklist ath12k
blacklist ath12k_wifi7
