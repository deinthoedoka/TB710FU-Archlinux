# NBD-root boots (cmdline tb710fu.nbd): the root filesystem is on the USB gadget link, so the
# type-C role switch and the USB SS mux must not probe - they reinitialize DWC3 and the kernel
# loses its root fs mid-boot. tb-modprobe-nbd-guard refuses them only on such boots; a normal
# UFS boot loads them as usual.
install ucsi_glink /usr/local/sbin/tb-modprobe-nbd-guard ucsi_glink
install pmic_glink_altmode /usr/local/sbin/tb-modprobe-nbd-guard pmic_glink_altmode
install wcd939x-usbss /usr/local/sbin/tb-modprobe-nbd-guard wcd939x-usbss
