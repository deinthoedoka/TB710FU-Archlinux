# TB710FU: the power key is a PMIC pwrkey, and logind's default HandlePowerKey=poweroff
# shuts the machine down on a short press. Ignore the short press (the desktop
# environment offers its own menu on it); a long press is still handled by the PMIC.
[Login]
HandlePowerKey=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
