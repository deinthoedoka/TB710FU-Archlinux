# TB710FU: the built-in mic path is not routed; its pro-input node hung WirePlumber at start
# (10/20) and `systemctl restart` then hangs too (only kill -9 helps). Keep it disabled until
# the capture path is actually brought up.
monitor.alsa.rules = [
  { matches = [ { node.name = "~alsa_input.platform-sound.*" } ] actions = { update-props = { node.disabled = true } } }
]
