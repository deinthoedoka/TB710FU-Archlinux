# The sy7758 backlight is a separate I2C device: deniald (running as the
# desktop user in the video group) must write bl_power to make DPMS off real.
# 90-tb-backlight.rules does the same for hotplug; this covers the built-in
# device that udev may have handled before the rule was available.
z /sys/class/backlight/sy7758-backlight/brightness 0664 root video - -
z /sys/class/backlight/sy7758-backlight/bl_power 0664 root video - -
