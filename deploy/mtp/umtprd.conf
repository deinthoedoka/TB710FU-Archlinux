# TB710FU MTP 配置 — 2026-11-01
# 拔线后保持运行,重新插线即恢复(注意:此配置解析为十六进制,必须写 0x1)
loop_on_disconnect 0x1

# Windows 上显示的设备名(FFS 模式下设备字符串由这里提供)
manufacturer "Lenovo"
product "TB710FU"
serial "tb710fu-arch"
firmware_version "Arch Linux ARM"

# MTP 里的存储:以 alarm 身份读写,新建文件归 alarm 所有
storage "/home/alarm" "TB710FU 内部存储" "rw,uid=1000,gid=1000"

# 广播微软/安卓 MTP 扩展(Windows 资源管理器兼容性)
mtp_extensions "microsoft.com: 1.0; android.com: 1.0;"

interface "MTP"

# Windows 图标显示为"平板"(0x5)
perceived_device_type 0x5

# 像手机一样向电脑报告电量
battery_capacity "/sys/class/power_supply/battery/capacity"

# FunctionFS 模式(uMTP-Responder 官方标准用法)
usb_functionfs_mode 0x1
usb_dev_path   "/dev/ffs-mtp/ep0"
usb_epin_path  "/dev/ffs-mtp/ep1"
usb_epout_path "/dev/ffs-mtp/ep2"
usb_epint_path "/dev/ffs-mtp/ep3"
usb_max_packet_size 0x200
