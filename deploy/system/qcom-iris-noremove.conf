# TB710FU: never unload qcom_iris at runtime.
#
# iris_remove() can block forever (it waits on the firmware/HFI state). When a
# `modprobe -r qcom_iris` is interrupted - an SSH timeout, a killed process, a
# busy VPU - the kernel leaves the module in state "Unloading" with refcnt = -1
# (see /proc/modules). delete_module never returns, the task cannot be killed,
# and the next shutdown hangs on it at a black screen with white text; the VPU
# also stays dead until the tablet reboots.
#
# This rule makes `modprobe -r qcom_iris` fail in userspace before it ever
# reaches the kernel. A new qcom-iris.ko therefore takes effect on the next
# boot, which is the only supported way to update it (deploy/vaapi/install.sh
# installs the file and tells you to reboot).
#
# Deliberate bypass, if you really know you want it: modprobe -r -i qcom_iris
remove qcom_iris /bin/false
