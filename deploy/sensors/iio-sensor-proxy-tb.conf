[Unit]
Description=IIO Sensor Proxy service (TB710FU ordering)
After=hexagonrpcd-adsp-sensorspd.service
Wants=hexagonrpcd-adsp-sensorspd.service

[Service]
# hexagonrpcd 起来后 DSP 还要几秒才注册传感器；抢跑会让服务以
# “No sensors” 退出并重启，所有客户端的 claim 全部失效。
ExecStartPre=/usr/local/bin/tb-wait-sensors

[Install]
WantedBy=multi-user.target
