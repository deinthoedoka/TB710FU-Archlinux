# TB710FU desktop responsiveness: keep dentries/inodes cached and start
# writeback earlier so a background copy cannot stall the foreground.
# The zram settings stay in 90-zram.conf.
vm.vfs_cache_pressure = 50
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15
vm.dirty_expire_centisecs = 1500
vm.dirty_writeback_centisecs = 500

# A tablet is one interactive session; autogroup keeps a background
# compile/download from competing with the compositor and the focused app.
kernel.sched_autogroup_enabled = 1
